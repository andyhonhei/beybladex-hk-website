# Reverse proxy for the Beyblade status site.
# Serves product photos and the logo as files so Python never handles those bytes.
#
# Repo on EC2: /home/ubuntu/hobbyland_checknew_product
# Bind the Python status server to 127.0.0.1:8080 (not 0.0.0.0).
# Open only 80/443 on the security group. Put Cloudflare in front of this host.
# Public: beybladex-watch.andyhhh.com  Admin notify: beybladex-admin.andyhhh.com
# /go/* hop pages send Cache-Control from Python (24h edge, stale-if-error 7d).
#
# sudo cp deploy/nginx-beyblade-status.conf /etc/nginx/sites-available/beybladex-watch
# sudo ln -s /etc/nginx/sites-available/beybladex-watch /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name beybladex-watch.andyhhh.com;

    # TLS: terminate on this box (Full strict in Cloudflare) or let Cloudflare
    # Flexible talk HTTP here. Prefer HTTPS on origin if you have a cert.

    root /home/ubuntu/hobbyland_checknew_product;

    location /images/ {
        alias /home/ubuntu/hobbyland_checknew_product/data/images/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location = /logo.png {
        root /home/ubuntu/hobbyland_checknew_product/static;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location = /alipayhk.jpg {
        root /home/ubuntu/hobbyland_checknew_product/static;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location = /favicon.ico {
        root /home/ubuntu/hobbyland_checknew_product/static;
        try_files /logo.png =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        types { }
        default_type image/png;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name beybladex-admin.andyhhh.com;

    root /home/ubuntu/hobbyland_checknew_product;

    location = /logo.png {
        root /home/ubuntu/hobbyland_checknew_product/static;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location = /favicon.ico {
        root /home/ubuntu/hobbyland_checknew_product/static;
        try_files /logo.png =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        types { }
        default_type image/png;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
